name: Build Flutter APK

on:
  push:
    branches: [ "principal", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        # Si tu proyecto está en una subcarpeta, descomenta la siguiente línea y pon su nombre:
        # working-directory: nombre-de-tu-subcarpeta

      - name: Build APK
        run: flutter build apk --release
        # working-directory: nombre-de-tu-subcarpeta

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
